# Atlas configuration — all values here are overridable by environment variables.
# Secrets (tokens, API keys) must live in .env only, never here.

orchestrator:
  poll_interval_sec: 5
  max_concurrent_tasks: 3          # raise to 5+ on a beefy machine

logging:
  level: INFO                       # DEBUG for verbose agent output

sessions:
  session_prefix: atlas
  tmux_socket: ~                    # null = default socket; set path to share socket

claude_code:
  command: claude
  max_execution_sec: 3600           # 1 h hard cap per task
  poll_interval_sec: 2              # how often Atlas checks tmux pane output
  launch_wait_sec: 20               # wait after spawning claude before polling (bumped from 15)
  idle_stable_polls: 3              # consecutive idle reads before marking done
  capture_lines: 200                # pane lines captured per poll
  kill_session_on_finish: false     # kill session after EVERY run (overrides on_success)
  kill_session_on_success: true     # kill on success; failed sessions stay for post-mortem

browser:
  headless: true
  timeout_ms: 30000                 # per-action Playwright timeout
  max_runtime_sec: 120              # hard cap for an entire browser task
  screenshots_dir: logs/screenshots
  capture_success_screenshot: true
  capture_failure_screenshot: true
  viewport_width: 1280
  viewport_height: 720

recovery:
  max_recovery_attempts: 5          # total retries before giving up
  max_same_strategy_failures: 2     # switch strategy after this many same-strategy fails
  investigate_after_failures: 2     # trigger root-cause analysis after N failures
  escalate_after_attempts: 6        # ask human via Slack after this many total attempts

git:
  enabled: true
  branch_prefix: atlas/task
  protected_branches:
    - main
    - master
  block_work_on_protected: true     # force Atlas onto a task branch, never touch main
  auto_checkpoint_before_retry: true
  auto_isolate_branch: true
  max_consecutive_rollbacks: 3
  max_dependency_modifications: 5   # flag if Claude touches package files this many times
  health_regression_threshold: 15   # score-point drop that counts as regression
  progressive_worsening_attempts: 3 # consecutive worsening snapshots -> escalate

memory:
  enabled: true
  db_path: memory/atlas.db
  prune_max_age_days: 90
  inject_context_into_prompts: true

runtime:
  enabled: true
  state_path: logs/runtime_state.json
  stale_task_hours: 72              # tasks stuck longer than this are force-cancelled
  max_runaway_retries: 10           # hard stop for a task retrying in a tight loop (was 15)
  max_browser_concurrent: 2
  max_claude_concurrent: 2
  per_project_max_concurrent: 2
  snapshot_interval_ticks: 12       # persist runtime state every N orchestrator ticks
  orphan_session_cleanup: true      # kill tmux sessions with no matching task on boot

# Known project repos — used by /atlas start --project <name>
# repo_path must be an absolute path to a local git repo.
#
# Optional per-project fields:
#   test_command / build_command — quality gates run after Claude finishes;
#                                  non-zero exit routes the task to recovery
#   check_timeout_sec            — hard cap per gate command (default 600)
#   verify_url                   — default browser smoke-verify target
#   github_owner / github_repo   — PR target repo (token stays in GITHUB_TOKEN)
projects:
  assignmint:
    repo_path: "C:/Users/shamz/Desktop/Assignmint"
    description: "AssignMint React Native app"
    github_owner: "syedhamzahabib2026-source"
    github_repo: "Assignmint"
    # Quality gates — Atlas runs these after Claude finishes. Fail = retry, not "done".
    build_command: "npm run typecheck"
    # Full `npm run test:ci` currently fails (broken firebase/auth mocks in repo).
    # These sanity checks pass today and still catch broken navigation / entry point.
    test_command: "npm run check:entry && npm run validate:screens"
    check_timeout_sec: 600
    # No verify_url — mobile app, not a website Atlas can open in a browser

# Worker pools — subscription-first routing, API fallback (Phase 13)
worker_pools:
  enabled: true
  subscription:
    pool_id: subscription
    session_prefix: atlas-sub
    max_workers: 2
    priority: 10
    cooldown_sec: 600
  api:
    pool_id: api
    session_prefix: atlas-api
    max_workers: 2
    priority: 20
    cooldown_sec: 300
  local:
    pool_id: local
    enabled: false
    session_prefix: atlas-local
    max_workers: 0

deployment:
  enabled: true
  auto_start_after_merge: true
  mock_ci: true
  mock_deploy: true
  staging_url_template: "https://staging.example.com"
  production_url_template: "https://app.example.com"
  staging_verify_enabled: true
  production_requires_approval: true
  never_auto_deploy_critical: true

approval:
  enabled: true
  auto_approve_low_risk: true
  require_approval_high_risk: true
  require_approval_for_dependencies: true
  require_approval_for_deployments: true
  escalate_on_high_rollback_count: 3
  escalate_on_excessive_retries: 6

scanner:
  interval_hours: 6             # background scan frequency (0 = disable background loop)
  enabled: true                 # set false to disable proactive Slack suggestions entirely

# Slack tokens/IDs belong in .env — only non-secret Slack settings here.
slack:
  enabled: false                    # overridden by ATLAS_SLACK_ENABLED=true in .env
  log_tail_lines: 40
  stop_kill_session_default: false
